services:
  db:
    image: postgres:16-alpine
    container_name: kampanya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kampanya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampanya_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kampanya_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kampanya_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kampanya_user} -d ${POSTGRES_DB:-kampanya_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kampanya_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kampanya_user}:${POSTGRES_PASSWORD:-kampanya_pass}@db:5432/${POSTGRES_DB:-kampanya_db}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    networks:
      - kampanya_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  kampanya_net:
    driver: bridge

volumes:
  pg_data:
    driver: local
